  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #191419; }
  #root { width: 1080px; height: 1920px; position: relative; overflow: hidden; background: #191419; font-family: "Inter", sans-serif; }
  .scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
  .clip { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .cap { position: absolute; left: 40px; right: 40px; top: 470px; text-align: center; color: #fff; font-size: 66px; font-weight: 700; line-height: 1.15; text-shadow: 0 4px 0 rgba(0,0,0,.35); }

  .sub { position: absolute; left: 40px; right: 40px; bottom: 120px; text-align: center; color: #fff; font-size: 58px; font-weight: 700; line-height: 1.2; text-shadow: 0 4px 0 rgba(0,0,0,.35); }
  .sub .hl { color: #ff5db1; }
  #badge { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 50; pointer-events: none; }
  .ghost { position: absolute; will-change: transform, opacity; }
  .ghost img { width: 100%; height: 100%; display: block; }
  .robot { position: absolute; will-change: transform, opacity; }
  .robot img { width: 100%; height: 100%; display: block; }
  .coin { position: absolute; border-radius: 50%; background: #f5c542; border: 6px solid #c98f1b; color: #7a5200; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .confetti { position: absolute; border-radius: 4px; z-index: 1; }
  #s7 .ghost, #s7 .robot { z-index: 5; }
  #s7 .cap, #s7 .sub, #big500 { z-index: 2; }
  .z { position: absolute; color: #fff; font-weight: 700; text-shadow: 0 3px 0 rgba(0,0,0,.4); }
</style>
</head>

  tl.to("#robot1", { scale: 1.02, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 5, transformOrigin: "50% 50%" }, 0.2);

  tl.fromTo("#z1", { y: 0, opacity: 1 }, { y: -70, opacity: 0, duration: 1.8, repeat: 2, ease: "sine.in" }, 0.5);
  tl.fromTo("#z2", { y: 0, opacity: 1 }, { y: -70, opacity: 0, duration: 1.8, repeat: 2, ease: "sine.in" }, 1.1);
